name: Auto-update vessel schedule

# Pulls the fleet's current rotation straight from the same backend
# e-heunga.com's public "Schedule (Vessel)" search uses (see
# fetch_sinokor_schedule.py for how/why), rebuilds the dashboard, and
# pushes it -- so the site refreshes itself without anyone needing to
# forward a SKED.xls file.
#
# This calls an undocumented, unauthenticated endpoint discovered by
# inspecting e-heunga.com's own network traffic. If it starts failing,
# that's the first thing to suspect -- the manual update.bat / drag-a-
# file workflow still works as a fallback regardless.

on:
  schedule:
    # Times are UTC; Bangkok is UTC+7. GitHub only treats them as earliest
    # start times and in practice fired just 18% of an hourly schedule
    # (9/29-10/10), so the real triggers are external: Windows Task
    # Scheduler on the ops PC and an online cron service, both calling
    # workflow_dispatch with scheduled=true. These crons are the fallback.
    # Main:   07:00, 12:00, 17:00, 22:00 Bangkok
    - cron: '0 0,5,10,15 * * *'
    # Backup: 08:00, 13:00, 18:00, 23:00 Bangkok
    - cron: '0 1,6,11,16 * * *'
  workflow_dispatch:
    inputs:
      scheduled:
        description: "true = automated trigger: skip if this slot was already updated"
        required: false
        default: 'false'

permissions:
  contents: write
  actions: read   # the backup gate lists this workflow's recent runs

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Several automated triggers aim at each slot (GitHub crons, Task
      # Scheduler, online cron); the first to succeed does the update and
      # the rest exit here. A person running it by hand always goes ahead.
      - name: Skip if this slot was already updated
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULED: ${{ inputs.scheduled }}
        run: |
          if [ "$EVENT" != "schedule" ] && [ "$SCHEDULED" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh run list --repo "$GITHUB_REPOSITORY" --workflow auto-update.yml --limit 30 \
            --json databaseId,conclusion,createdAt > "$RUNNER_TEMP/runs.json"
          python3 - <<'PY'
          import datetime as dt, json, os
          now = dt.datetime.now(dt.timezone.utc)
          today = now.replace(minute=0, second=0, microsecond=0)
          # Latest main slot (00/05/10/15 UTC) at or before now -- the one
          # this run covers, even if its trigger fired late.
          slots = [today.replace(hour=h) for h in (0, 5, 10, 15) if today.replace(hour=h) <= now]
          slot = max(slots) if slots else (today - dt.timedelta(days=1)).replace(hour=15)
          me = int(os.environ["GITHUB_RUN_ID"])
          runs = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "runs.json")))
          done = [r["databaseId"] for r in runs
                  if r["databaseId"] != me and r["conclusion"] == "success"
                  and dt.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) >= slot]
          if done:
              print(f"Slot {slot:%H:%M} UTC already updated by run {done[0]} -- skipping")
          else:
              print(f"No successful run since slot {slot:%H:%M} UTC -- updating")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'false' if done else 'true'}\n")
          PY

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install pandas openpyxl xlrd requests searoute

      - name: Pull latest schedule from the Sinokor/Heung-A API
        id: fetch
        if: steps.gate.outputs.run == 'true'
        run: |
          STAMP=$(date -u +'%Y%m%d-%H%M')
          OUT="input/auto-${STAMP}-SKED.xlsx"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          python fetch_sinokor_schedule.py --out "$OUT" --months-forward 2

      - name: Regenerate dashboard
        if: steps.gate.outputs.run == 'true'
        run: |
          python generate_vessel_schedule.py --full "${{ steps.fetch.outputs.out }}"
          cp "Vessel Schedule.html" index.html

      - name: Commit and push if anything changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.fetch.outputs.out }}" "Vessel Schedule.html" "Vessel Schedule.xlsx" index.html sked_current.xlsx sked_prev.xlsx sked_meta.json
          if git diff --cached --quiet; then
            echo "No changes -- nothing to push"
          else
            git commit -m "Auto-update (full): $(basename "${{ steps.fetch.outputs.out }}" .xlsx)"
            # Someone else (a colleague's manual update, a person pushing
            # while this run was in flight) can land a commit on main
            # first -- retry with a rebase instead of failing the run.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected (attempt $i), pulling --rebase and retrying..."
              git pull --rebase origin main
            done
          fi
